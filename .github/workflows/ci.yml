name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Self-hosted and ephemeral; the image in .github/runner/runner carries
    # Ruby, spinel and spinelkit in /opt/vendor. Pull requests from forks
    # don't run here: the runner is a private machine.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, spinrail]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: make -f toolchain.mk setup VENDOR=/opt/vendor
      - name: Compiler unit tests
        run: ruby -S rake unit
      - name: Request tests
        run: ruby -S rake apps
